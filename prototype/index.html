<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Living Text — Desktop Design Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#070707; --panel:#121212; --line:rgba(201,164,92,.28); --line2:rgba(201,164,92,.55);
  --gold:#d4a84f; --gold2:#e8cb8a; --gold-dim:#8f7440; --text:#ece6d8; --muted:#948c7a; --err:#d86a5a; --ok:#8bb27a; --warn:#d9a441;
  --serif:'EB Garamond',Georgia,serif; --display:'EB Garamond',Georgia,serif; --sans:'Inter',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#000;color:var(--text);font-family:var(--sans);font-size:14px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font:inherit;color:var(--text);background:#0b0b0b;border:1px solid var(--line);border-radius:6px;padding:8px 10px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--gold)}

#review{display:flex;gap:6px;align-items:center;padding:8px 14px;background:#000;border-bottom:1px solid #222;overflow-x:auto;white-space:nowrap}
#review .lbl{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.12em;margin-right:6px}
#review button{padding:5px 11px;border:1px solid #2a2a2a;border-radius:99px;color:#aaa;font-size:12px}
#review button.on{border-color:var(--gold);color:var(--gold2);background:rgba(201,164,92,.08)}
#review .sep{width:1px;height:18px;background:#333;margin:0 6px}

#stage{height:calc(100% - 45px);padding:14px;display:flex;justify-content:center;background:#050505}
#app{width:100%;max-width:1440px;height:100%;min-height:620px;border:1px solid #1f1f1f;border-radius:10px;overflow:hidden;position:relative;background:var(--bg);display:grid;grid-template-columns:240px 1fr 300px;grid-template-rows:56px minmax(0,1fr) 124px}
#app.admin{grid-template-columns:230px 1fr;grid-template-rows:56px minmax(0,1fr)}
#app.noright{grid-template-columns:240px 1fr}
#app.noplayer{grid-template-rows:56px minmax(0,1fr)}
.sun{position:absolute;inset:0;pointer-events:none;z-index:0;
 background:
  conic-gradient(from 196deg at 100% -6%,transparent 0deg,rgba(232,203,138,.10) 6deg,transparent 12deg,rgba(232,203,138,.07) 20deg,transparent 28deg,rgba(232,203,138,.09) 36deg,transparent 46deg),
  radial-gradient(760px 380px at 100% -6%,rgba(232,203,138,.20),transparent 62%),
  radial-gradient(380px 200px at 100% 0,rgba(255,226,160,.14),transparent 70%)}
#app>*{position:relative;z-index:1}
#app>.sun{position:absolute;z-index:0}
#app>.navback{position:absolute;z-index:20}
#app>.navpanel{position:absolute;z-index:21}

header.top{grid-column:1/-1;display:grid;grid-template-columns:240px 1fr 300px;align-items:center;border-bottom:1px solid var(--line);background:rgba(7,7,7,.88)}
#app.admin header.top{grid-template-columns:230px 1fr auto}
#app.noright header.top{grid-template-columns:240px 1fr 240px}
.brand{display:flex;align-items:center;gap:10px;padding:0 18px}
.brand img{width:34px;height:34px;border-radius:6px;object-fit:cover;border:1px solid var(--line)}
.brand span{font-family:var(--display);letter-spacing:.22em;font-size:13px;color:var(--gold2)}
.ref{justify-self:center;font-family:var(--display);font-size:21px;letter-spacing:.03em;color:var(--text);padding:6px 16px;border-radius:6px;display:flex;gap:7px;align-items:center}
.ref:hover{background:rgba(201,164,92,.08)}
.ref small{color:var(--gold);font-size:11px}
.topr{justify-self:end;display:flex;align-items:center;gap:14px;padding:0 18px;color:var(--text)}
.esv{font-family:var(--display);font-size:18px}.esv small{color:var(--gold);font-size:10px}
.more{letter-spacing:3px;color:var(--gold);font-weight:700}
.chip{border:1px solid var(--line);border-radius:99px;padding:4px 10px;font-size:12px;color:var(--gold2)}

aside.side{border-right:1px solid var(--line);padding:16px 12px;overflow:auto;background:rgba(10,10,10,.72)}
.nav button{display:flex;width:100%;gap:10px;align-items:center;padding:9px 12px;border-radius:6px;color:var(--muted);text-align:left}
.nav button:hover{color:var(--text)}
.nav button.on{color:var(--gold2);background:rgba(201,164,92,.09);box-shadow:inset 2px 0 var(--gold)}
.side h4{font-size:10.5px;letter-spacing:.16em;color:var(--gold-dim);text-transform:uppercase;margin:22px 12px 8px;font-weight:500}
.rec{display:flex;gap:10px;align-items:center;width:100%;padding:7px 8px;border-radius:6px;text-align:left}
.rec:hover{background:rgba(201,164,92,.06)}
.rv{will-change:opacity,transform}
.thumb{width:40px;height:40px;border-radius:5px;flex:none;border:1px solid var(--line);position:relative;overflow:hidden;display:block}
.thumb .scene{position:absolute;inset:0;width:100%;height:100%}
.rec b{display:block;font-family:var(--display);font-size:16px;font-weight:500}
.rec small{color:var(--muted);font-size:11.5px}
.dot{width:6px;height:6px;border-radius:50%;background:var(--gold);box-shadow:0 0 6px var(--gold);display:inline-block}

main{overflow:auto;padding:28px 44px}
main.center{display:flex;flex-direction:column;align-items:center}
.col{width:100%;max-width:720px}
.fillcol{min-height:100%;display:flex;flex-direction:column;margin:0 auto}
h1{font-family:var(--display);font-weight:500;font-size:34px;color:var(--gold2);letter-spacing:.02em}
h2{font-family:var(--display);font-weight:500;font-size:22px;color:var(--gold2)}
.sub{color:var(--muted);margin-top:4px}
.scripture{font-family:var(--serif);font-size:22px;line-height:1.6;margin-top:18px}
.v{display:grid;grid-template-columns:46px 1fr;padding:6px 12px 6px 0;border-radius:8px;cursor:default;border:1px solid transparent;margin-bottom:2px}
.v .vn{font-family:var(--display);color:var(--gold);font-size:21px;line-height:1.5;padding-left:10px}
.v.pick{cursor:pointer}.v.pick:hover{background:rgba(201,164,92,.05)}
.v.sel{background:rgba(201,164,92,.10);box-shadow:inset 2px 0 var(--gold)}
.v.cur{border-color:var(--gold);background:linear-gradient(180deg,rgba(212,168,79,.16),rgba(212,168,79,.07));box-shadow:0 0 24px rgba(212,168,79,.12)}
.v.gone{opacity:0;pointer-events:none}
.v.fade{opacity:.34;--o:.34}
.v.fade .dl{border-bottom-color:rgba(236,230,216,.9)}
@keyframes cascade{from{opacity:0;transform:translateY(6px)}to{opacity:var(--o,1);transform:none}}.v.fade:hover{opacity:.6}
.mini.on{background:rgba(212,168,79,.18);box-shadow:0 0 14px rgba(212,168,79,.25)}
.v.big{font-size:32px;line-height:1.5;padding:10px 0;grid-template-columns:60px 1fr}
.v.big .vn{font-size:28px}
.dl{border-bottom:1.5px dashed rgba(236,230,216,.42);height:26px;margin-bottom:4px}
.btn{border:1px solid var(--gold);color:var(--gold2);padding:9px 20px;border-radius:7px;background:rgba(201,164,92,.07);display:inline-flex;gap:9px;align-items:center;justify-content:center}
.btn:hover{background:rgba(201,164,92,.16);box-shadow:0 0 18px rgba(201,164,92,.18)}
.btn.solid{background:linear-gradient(180deg,#e0c07a,#a8843f);color:#120d03;border-color:#d8b872;font-weight:600}
.btn.ghost{border-color:var(--line);color:var(--muted)}
.btn.sm{padding:5px 12px;font-size:12px}
.btn.wide{width:100%;padding:13px;font-family:var(--display);font-size:19px;border-radius:9px;background:rgba(20,18,12,.85)}
.btn svg,.menu svg,.bi svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.row{display:flex;gap:12px;align-items:center}.between{justify-content:space-between}
.card{border:1px solid var(--line);border-radius:10px;padding:18px;background:rgba(18,18,18,.7)}
.tabs{display:flex;gap:26px;border-bottom:1px solid var(--line)}
.tabs button{padding:8px 2px;color:var(--muted)}.tabs button.on{color:var(--gold2);box-shadow:0 1px var(--gold)}

aside.right{border-left:1px solid var(--line);padding:18px;overflow:auto;background:rgba(10,10,10,.72)}

/* player — matches mobile: end-mode | skip back | ring play | skip fwd | genre */
footer.player{grid-column:1/-1;border-top:1px solid var(--line);background:rgba(8,8,8,.94);display:flex;align-items:center;justify-content:center}
.pl-mid{padding:0 24px;display:flex;flex-direction:column;gap:4px;max-width:680px;width:100%}
.bar{height:4px;background:#2c2a26;border-radius:4px;position:relative;margin-top:4px}
.bar i{position:absolute;left:0;top:0;bottom:0;width:18%;background:linear-gradient(90deg,#e8cb8a,#d4a84f);border-radius:4px}
.bar i:after{content:"";position:absolute;right:-6px;top:-4px;width:12px;height:12px;border-radius:50%;background:var(--gold2);box-shadow:0 0 8px rgba(232,203,138,.6)}
.times{display:flex;justify-content:space-between;font-size:12px;color:var(--text)}
.transport{display:flex;justify-content:space-between;align-items:center;padding:2px 6px}
.ico{width:40px;height:40px;display:grid;place-items:center;color:var(--gold);border-radius:50%}
.ico:hover{color:var(--gold2);box-shadow:0 0 14px rgba(212,168,79,.25)}
.ico svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.ico.play{width:60px;height:60px;border:1.5px solid var(--gold);background:#0a0a0a}
.ico.play svg{width:28px;height:28px;fill:var(--gold);stroke:none}
.tw{position:relative;display:inline-flex}
.menu{position:absolute;bottom:54px;left:0;width:250px;background:#0c0c0c;border:1px solid var(--line2);border-radius:10px;padding:6px;box-shadow:0 14px 40px rgba(0,0,0,.75);z-index:8}
.menu.r{left:auto;right:0;width:150px}
.menu button{display:flex;gap:12px;align-items:center;width:100%;padding:10px;border-radius:6px;text-align:left;color:var(--text)}
.menu button:hover{background:rgba(201,164,92,.08)}
.menu svg{stroke:var(--gold)}
.menu .chk{margin-left:auto;color:var(--gold);font-size:16px}
.menu small{display:block;color:var(--muted);font-size:11px}

/* memorization stepper */
.stepper{display:flex;align-items:center;gap:10px;background:rgba(22,19,13,.85);border:1px solid var(--line);border-radius:14px;padding:16px 16px 12px;margin-top:auto}
.tri{width:30px;height:30px;color:var(--gold);display:grid;place-items:center}
.tri svg{width:22px;height:22px}
.tri:hover{color:var(--gold2)}
.sdots{flex:1;display:flex;justify-content:space-between;position:relative;padding:0 6%}
.sdots:before{content:"";position:absolute;left:12%;right:12%;top:11px;height:1px;background:var(--gold-dim)}
.sd{display:flex;flex-direction:column;align-items:center;gap:9px;position:relative;z-index:1;font-family:var(--display);font-size:17px;color:var(--text)}
.sd i{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--gold-dim);background:#0b0b0b;display:block}
.sd.on{color:var(--gold2)}
.sd.on i{background:radial-gradient(circle at 40% 35%,#fff4d2,#e8cb8a 50%,#a8843f);box-shadow:0 0 16px rgba(232,203,138,.75);border-color:var(--gold2)}
.mini{width:42px;height:42px;border:1.5px solid var(--gold);border-radius:10px;color:var(--gold);display:grid;place-items:center;background:rgba(12,10,6,.8)}
.mini svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round}
.mini.q{border-radius:50%}
.mini.q svg{width:20px;height:24px;stroke-width:1.7}
.help{margin-top:12px;padding:12px 16px;border-left:2px solid var(--gold);background:rgba(212,168,79,.07);color:var(--muted);border-radius:0 8px 8px 0;font-size:13px}

/* flashcards */
.fcrow{display:flex;align-items:center;gap:18px;margin-top:18px;width:100%;max-width:760px}
.fc-wrap{perspective:1200px;flex:1}
.fc{width:100%;height:330px;position:relative;transform-style:preserve-3d;transition:transform .6s cubic-bezier(.2,.7,.2,1);cursor:pointer}
.fc.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border:1.5px solid var(--gold);border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(520px 240px at 95% 0,rgba(232,203,138,.20),transparent 70%),#0a0a0a;padding:30px 40px;text-align:center}
.face.back{transform:rotateY(180deg)}
.face .bk{font-family:var(--display);letter-spacing:.3em;color:var(--gold);font-size:16px}
.face .cv{font-family:var(--display);font-size:82px;color:var(--text);margin:8px 0}
.face .hint{color:var(--muted);font-family:var(--display);font-size:17px}
.face .vt{font-family:var(--serif);font-size:26px;line-height:1.5;display:grid;grid-template-columns:44px auto;gap:6px;text-align:left;align-items:start}
.face .vt b{font-family:var(--display);color:var(--gold);font-size:28px;font-weight:500}
.shuf{color:var(--gold);font-family:var(--display);font-size:19px;display:flex;gap:9px;align-items:center;margin-top:18px}
.shuf svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}

/* choice */
.opt{width:100%;display:flex;align-items:center;gap:18px;text-align:left;border:1px solid var(--gold);border-radius:12px;padding:22px 24px;background:rgba(20,18,12,.8);margin-bottom:16px}
.opt:hover{box-shadow:0 0 26px rgba(212,168,79,.18)}
.opt svg.big{width:34px;height:34px;fill:none;stroke:var(--gold);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none}
.opt h2{color:var(--text);font-size:24px}.opt .sub{font-family:var(--serif);font-size:15px}.opt .go{margin-left:auto;color:var(--gold);font-size:24px}

/* home */
.hero{width:100%;max-width:880px;height:310px;border-radius:14px;border:1px solid var(--line2);overflow:hidden;position:relative;display:flex;align-items:center;justify-content:center;background:#08080a}
.hero .scene{position:absolute;inset:0;width:100%;height:100%}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.25),transparent 35%,rgba(7,7,7,.75) 100%);pointer-events:none}
.hero .herologo{position:relative;z-index:2;width:250px;filter:brightness(1.35) contrast(1.1) drop-shadow(0 4px 18px rgba(0,0,0,.7))}

/* verse selector */
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:9px;margin-top:16px}
.vb{height:48px;border:1px solid var(--line);border-radius:8px;font-family:var(--display);font-size:20px;color:var(--text);background:#0d0d0d}
.vb:hover{border-color:var(--gold)}
.vb.range{background:rgba(212,168,79,.22);border-color:var(--gold-dim);color:var(--gold2)}
.vb.end{background:linear-gradient(180deg,#e8c97e,#c99c44);color:#17110a;border-color:#e8cb8a;font-weight:600}
.dd{display:flex;justify-content:space-between;align-items:center;width:100%;border:1px solid var(--gold);border-radius:9px;padding:12px 16px;font-family:var(--display);font-size:21px;background:#0b0b0b}
.dd small{color:var(--gold)}

/* book / chapter selector */
.navback{position:absolute;inset:56px 0 0 0;background:rgba(0,0,0,.55);z-index:20}
.navback.clear{inset:0;background:transparent}
.navpanel{position:absolute;background:#0a0a0a;border:1px solid var(--line2);border-top:0;border-radius:0 0 12px 12px;z-index:21;display:flex;flex-direction:column;box-shadow:0 30px 60px rgba(0,0,0,.8)}
.navpanel.under{border-top:1px solid var(--line2);border-radius:12px}
.tabs2{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--line);position:relative}
.tabs2 .slider{position:absolute;left:0;bottom:-1px;width:50%;height:2px;background:var(--gold);transition:transform .38s cubic-bezier(.65,0,.25,1);pointer-events:none}
.tabs2 button{padding:14px;font-family:var(--display);font-size:18px;color:var(--muted);transition:color .3s}
.tabs2 button.on{color:var(--gold2)}
.navlist{overflow:auto;padding:8px 18px 18px}
.nb{display:flex;justify-content:space-between;width:100%;padding:9px 4px;font-family:var(--display);font-size:20px;color:var(--muted);text-align:left}
.nb:hover{color:var(--text)}.nb.on{color:var(--gold2)}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:8px;padding:6px 0 12px}
.cb{height:40px;border:1px solid var(--line);border-radius:7px;font-family:var(--display);font-size:18px;background:#101010}
.cb:hover{border-color:var(--gold)}.cb.cur{background:linear-gradient(180deg,#e8c97e,#c99c44);color:#17110a;border-color:#e8cb8a}

/* admin */
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:20px}
.stat b{display:block;font-family:var(--display);font-size:34px;color:var(--gold2);font-weight:500}
table{width:100%;border-collapse:collapse;margin-top:14px}
th{font-weight:500;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold-dim);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:11px 10px;border-bottom:1px solid #1a1a1a}
tr:hover td{background:rgba(201,164,92,.04)}
.pill{padding:2px 9px;border-radius:99px;font-size:11.5px;border:1px solid}
.pill.draft{color:var(--muted);border-color:#444}.pill.review{color:var(--warn);border-color:var(--warn)}.pill.pub{color:var(--ok);border-color:var(--ok)}
.wizard{display:flex;gap:4px;margin:18px 0 22px;align-items:center}
.wz{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px;padding:6px 10px}
.wz i{width:22px;height:22px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-style:normal;font-size:11px}
.wz.on{color:var(--gold2)}.wz.on i{background:var(--gold);color:#111;border-color:var(--gold)}.wz.done i{border-color:var(--ok);color:var(--ok)}
.wz+.wz:before{content:"";width:18px;height:1px;background:var(--line);margin-right:6px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:14px 18px}
.form label{display:flex;flex-direction:column;gap:5px;color:var(--muted);font-size:12px}
.form .full{grid-column:1/-1}
.drop{border:1px dashed var(--line2);border-radius:12px;padding:40px;text-align:center;color:var(--muted);background:rgba(201,164,92,.03)}
.drop b{display:block;font-family:var(--display);font-size:22px;color:var(--gold2);font-weight:500;margin-bottom:6px}
.wf{width:100%;height:170px;background:#090909;border:1px solid var(--line);border-radius:8px;display:block;touch-action:none}
.tl{display:grid;grid-template-columns:44px 1fr 1fr 80px 1fr;gap:8px;align-items:center;padding:6px 8px;border-bottom:1px solid #1a1a1a}
.tl input{width:100%;padding:5px 8px;font-variant-numeric:tabular-nums;text-align:center}
.tl.sel{background:rgba(201,164,92,.09)}
.flag{font-size:11.5px}.flag.err{color:var(--err)}.flag.warn{color:var(--warn)}.flag.ok{color:var(--ok)}
.note{padding:10px 14px;border-left:2px solid var(--gold);background:rgba(201,164,92,.06);color:var(--muted);border-radius:0 6px 6px 0;font-size:12.5px;margin-top:14px}
.apbar{height:4px;background:#2c2a26;border-radius:4px;position:relative}.apbar i{position:absolute;left:0;top:0;bottom:0;width:30%;background:var(--gold);border-radius:4px}
.v{transition:opacity .35s ease,background .2s}
.btn,.ico,.vb,.cb,.nav button,.opt,.rec,.mini,.tri,.sd i{transition:background .2s,box-shadow .25s,border-color .2s,color .2s,transform .15s}
.vb:active,.cb:active,.btn:active{transform:scale(.97)}
.wipe{position:relative;overflow:hidden}
.wipe .fillx{position:absolute;inset:0;display:flex;align-items:center;justify-content:inherit;gap:inherit;padding:inherit;border-radius:inherit;
 background:linear-gradient(180deg,#e2c37e,#cfa44f);color:#16110a;clip-path:inset(0 100% 0 0);transition:clip-path .5s cubic-bezier(.22,.7,.2,1);pointer-events:none;text-align:left}
.wipe:hover .fillx,.wipe:focus-visible .fillx{clip-path:inset(0 0 0 0)}
.wipe .fillx *{color:#16110a !important}
.wipe .fillx svg{stroke:#16110a !important}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes cardin{from{opacity:0;transform:translateX(26px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.97)}to{opacity:1;transform:none}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes raysway{0%,100%{transform:rotate(-1.8deg);opacity:.85}50%{transform:rotate(1.8deg);opacity:1}}
@keyframes mistdrift{from{transform:translateX(-5%)}to{transform:translateX(5%)}}
@keyframes sunpulse{0%,100%{opacity:.82}50%{opacity:1}}
#app.enter main{animation:rise .45s cubic-bezier(.2,.7,.2,1) both}
#app.enter aside.right{animation:fadein .5s .1s both}

function pines(seed,base,x0,x1,n,h,fill){const r=rng(seed);let o='';for(let i=0;i<n;i++){const x=x0+(x1-x0)*r(),hh=h*(.55+r()*.8),w=hh*.3;let y=base;for(let k=0;k<3;k++){const tw=w*(1-k*.22),th=hh*.42;o+=`<path d="M${(x-tw).toFixed(1)},${y.toFixed(1)} L${x.toFixed(1)},${(y-th).toFixed(1)} L${(x+tw).toFixed(1)},${y.toFixed(1)}Z" fill="${fill}"/>`;y-=th*.5}}return o}

 const river=(kind==='hero'||kind==='river')?`<path d="M${W*.47},${H*.7} C${W*.53},${H*.78} ${W*.4},${H*.86} ${W*.5},${H} L${W*.8},${H} C${W*.64},${H*.88} ${W*.62},${H*.78} ${W*.52},${H*.7}Z" fill="url(#${id}w)" opacity=".8"/>`:'';
 const sheep=kind==='sheep'?`<path d="M0,${H} L0,${H*.8} Q${W*.5},${H*.62} ${W},${H*.82} L${W},${H}Z" fill="#241b0e"/><path d="M0,${H*.8} Q${W*.5},${H*.62} ${W},${H*.82}" fill="none" stroke="#d9a441" stroke-opacity=".55" stroke-width="1.2"/>
  <g transform="translate(${W*.52},${H*.7}) scale(${H/120})"><circle cx="-12" cy="0" r="9" fill="#efe3c6"/><circle cx="-2" cy="-6" r="10" fill="#f4ead0"/><circle cx="9" cy="-3" r="10" fill="#efe3c6"/><circle cx="16" cy="3" r="8" fill="#e6d8b8"/><circle cx="1" cy="4" r="10" fill="#e9dcbe"/><ellipse cx="25" cy="2" rx="6" ry="7" fill="#2b2016"/><rect x="-8" y="9" width="3" height="10" fill="#2b2016"/><rect x="8" y="9" width="3" height="10" fill="#2b2016"/></g>`:'';
 const trees=kind==='sheep'?'':pines(seed,H,0,W*.22,Math.round(W/70),H*.34,P.near)+pines(seed+3,H,W*.78,W,Math.round(W/80),H*.3,P.near);

 <linearGradient id="${id}f" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${P.far[0]}"/><stop offset="1" stop-color="${P.far[1]}"/></linearGradient>
 <linearGradient id="${id}m" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${P.mid[0]}"/><stop offset="1" stop-color="${P.mid[1]}"/></linearGradient>
 <linearGradient id="${id}w" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e8b85c" stop-opacity=".85"/><stop offset="1" stop-color="#3a2a10" stop-opacity=".9"/></linearGradient>

 return `<header class="top"><div class="brand"><img src="assets/reference/logo-reference-mark.png" alt="LT"><span>${admin?'LIVING TEXT · ADMIN':'LIVING TEXT'}</span></div>
 <button class="ref" ${admin?'':'onclick="toggleNav(this)"'}>${center}${arrow?'<small>▾</small>':''}</button>
 <div class="topr">${admin?'<span class="chip">glaspy21@gmail.com</span><button class="btn ghost sm" onclick="go(\'home\')">Exit admin</button>':'<span class="esv">ESV <small>▾</small></span><span class="more">•••</span>'}<button class="gear" title="Settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg></button></div></header>`;}
function thumb(a){const kind={'#c99c44':'river','#d9a441':'sheep','#8f7440':'trail'}[a]||(PAL[a]?a:'river');return `<span class="thumb">${scene(kind,120,120)}</span>`}
function listenerSide(active){
 const nav=[['home','Home'],['read','Read Scripture'],['choice','Memorize'],['cards','Flashcards']];
 return `<aside class="side"><div class="nav">${nav.map(([k,l])=>`<button class="${active===k?'on':''}" onclick="go('${k}')">${l}</button>`).join('')}</div>
 <h4>Recently studied</h4>
 ${[['John 1','The Word Became Flesh','#c99c44','#2a2112','John',1],['Psalm 23','The Lord Is My Shepherd','#d9a441','#3a2a10','Psalms',23],['Exodus 23','The Angel Before You','#8f7440','#1c1a14','Exodus',23]].map(r=>`<button class="rec" onclick="S.book='${r[4]}';S.chap=${r[5]};go('read')">${thumb(r[2],r[3])}<span><b>${r[0]}</b><small>${r[1]}</small></span></button>`).join('')}
 <div class="nav" style="margin-top:26px"><button onclick="go('dash')" style="color:var(--gold-dim)">Administrator →</button></div></aside>`;}
function setApp(c){$('#app').className=c||''}
const sun=()=>'<div class="sun"></div>';

/* book / chapter selector */
function navPanel(){if(!S.nav)return '';
 const list=S.navTab==='Old Testament'?OT:NT;
 const pos=S.navPos||{top:56,left:0,width:560,mode:'center'},anim=S.navAnim;S.navAnim=false;
 return `<div class="navback ${pos.mode==='left'?'clear':''} ${anim?'popin':''}" onclick="closeNav()"></div><div class="navpanel ${pos.mode==='left'?'under':''} ${anim?'popin':''}" style="top:${pos.top}px;left:${pos.left}px;width:${pos.width}px;max-height:calc(100% - ${pos.top+16}px)">
 <div class="tabs2">${['Old Testament','New Testament'].map(t=>`<button class="${S.navTab===t?'on':''}" onclick="setNavTab('${t}')">${t}</button>`).join('')}<i class="slider" style="transform:translateX(${(S.navFrom!=null?S.navFrom:S.navTab==='New Testament'?1:0)*100}%)"></i></div>
 <div class="navlist">${list.map(([b,n])=>{const open=S.navBook===b;const mus=MUSIC[b];
  return `<button class="nb ${open||(b===S.book&&!S.navBook)?'on':''}" onclick="navBook('${b}')"><span>${b}</span>${mus?'<i class="dot" title="Music available"></i>':''}</button>`+
  (open?`<div class="cgrid">${Array.from({length:n},(_,i)=>i+1).map(c=>`<button class="cb ${b===S.book&&c===S.chap?'cur':''}" onclick="pickChap('${b}',${c})">${c}${mus&&mus.includes(c)?'':''}</button>`).join('')}</div>`:'')}).join('')}</div></div>`}
// open the selector directly beneath the control that was clicked (no CSS transform, so nothing can jump)
function openNav(el,mode){const a=$('#app').getBoundingClientRect(),r=el.getBoundingClientRect();
 const width=mode==='left'?Math.min(Math.max(r.width,480),a.width-32):Math.min(560,a.width-32);let left=mode==='left'?r.left-a.left:r.left-a.left+r.width/2-width/2;
 left=Math.max(16,Math.min(a.width-width-16,left));
 S.navPos={top:mode==='left'?Math.round(r.bottom-a.top+6):56,left:Math.round(left),width,mode};S.nav=true;S.navAnim=true;render()}
function closeNav(){S.nav=false;render()}
function toggleNav(el){S.nav?closeNav():openNav(el,'center')}
function setNavTab(t){if(S.navTab===t)return;S.navFrom=S.navTab==='New Testament'?1:0;S.navTab=t;S.navBook=null;S.navAnim=false;render();
 const sl=$('.tabs2 .slider');if(sl){void sl.offsetWidth;sl.style.transform=`translateX(${t==='New Testament'?100:0}%)`}S.navFrom=null}
function navBook(b){S.navBook=S.navBook===b?null:b;render()}
function pickChap(b,c){S.enter=true;S.book=b;S.chap=c;S.nav=false;S.navBook=null;S.screen='read';render()}

/* ---------- verse helpers ---------- */
function dashed(t){const n=Math.max(1,Math.ceil(t.length/70));return Array.from({length:n},(_,i)=>`<div class="dl" style="width:${i===n-1&&n>1?55+((t.length*7)%35):100}%"></div>`).join('')}
function verseRow(n,body,cls,click,style){return `<div class="v ${cls||''}" data-n="${n}" ${click?`onclick="${click}"`:''} ${style?`style="${style}"`:''}><span class="vn">${n}</span><span class="vt">${body}</span></div>`}
// single vs multi verse view: Listen/Recall default single, Sing defaults multi, until the user toggles it
const multiOn=st=>S.multi===null?st===1:S.multi;
function focusLabel(st){return st===3?'Whole passage':multiOn(st)?'Focus: verse '+S.cur+' · click a verse to move focus':'Verse '+S.cur+' of '+S.range.a+'–'+S.range.b}
function multiTitle(st){return st===3?'Chain always shows the whole passage':multiOn(st)?'Showing several verses — click to focus on one':'Showing one verse — click to show the whole passage'}
// update focus/visibility in place so text never moves or resizes — only opacity transitions
function applyFocus(){const st=S.step;if(st===3)return;const multi=multiOn(st);
 const rows=[...document.querySelectorAll('.scripture .v')];const maxD=Math.max(...rows.map(e=>Math.abs(+e.dataset.n-S.cur)));
 rows.forEach(e=>{const n=+e.dataset.n,d=Math.abs(n-S.cur),f=n===S.cur,wasGone=e.classList.contains('gone'),nowGone=!multi&&!f;
  // stagger: verses ease in one after another, rippling out from the focused verse; they leave quickly, farthest first
  if(!f&&wasGone&&!nowGone){e.style.transitionDuration='.45s';e.style.transitionDelay=(d*70)+'ms'}
  else if(nowGone&&!wasGone){e.style.transitionDuration='.2s';e.style.transitionDelay=((maxD-d)*25)+'ms'}
  else{e.style.transitionDuration='.25s';e.style.transitionDelay='0ms'}
  e.classList.toggle('fade',multi&&!f);e.classList.toggle('gone',nowGone)});
 const l=$('#focuslbl');if(l)l.textContent=focusLabel(st);const b=$('#multibtn');if(b){b.classList.toggle('on',multi);b.title=multiTitle(st)}}
function toggleMulti(){if(S.step===3)return;S.multi=!multiOn(S.step);if(S.revealed){S.revealed=false;render()}else applyFocus()}
function focusTo(n){const was=S.revealed;S.cur=n;S.revealed=false;
 if(S.screen==='steps'&&S.step!==3&&!was)applyFocus();else render()}
function setCur(n){focusTo(n)}

/* ---------- LISTENER ---------- */
const V={};
V.home=()=>{setApp('noright noplayer');return sun()+header('Home')+listenerSide('home')+`<main class="center"><div class="col" style="max-width:880px;display:flex;flex-direction:column;align-items:center;padding-top:6px">
 <div class="hero">${scene('hero',880,310)}<img class="herologo" src="assets/reference/logo-reference-wordmark-cutout.png" alt="Living Text logo reference"></div>
 <div style="width:100%;max-width:720px;margin-top:22px;padding-bottom:80px">
  <button class="opt" onclick="go('steps')" style="padding:18px 22px"><span class="bi" style="color:var(--gold)">${ICON.note.replace('<svg','<svg class="big"')}</span><span><h2>Continue</h2><div class="sub">John 1:1 · last: Sing</div></span><span class="go">›</span></button>
  <button class="opt" onclick="go('read')" style="padding:18px 22px"><span class="bi">${ICON.book.replace('<svg','<svg class="big"')}</span><span><h2>Browse Scripture</h2><div class="sub">Choose a book and chapter</div></span><span class="go">›</span></button>
  <div class="row between" style="margin:26px 0 6px"><h2>Recently Studied</h2><button class="sub" style="color:var(--gold)" onclick="go('read')">See All</button></div>
  ${RECENTS.map(r=>`<button class="rec rv" style="border-bottom:1px solid #1a1a1a;border-radius:0;padding:10px 4px" onclick="go('read')">${thumb(r[2])}<span><b>${r[0]}</b><small>${r[1]}</small></span></button>`).join('')}
 </div></div></main>`+navPanel();};

V.read=()=>{setApp('');
 const body=isJ1()?`<div class="scripture">${VERSES.map((t,i)=>{const n=i+1;const inR=n>=S.range.a&&n<=S.range.b;return verseRow(n,t,'pick '+(inR?'sel':'')).replace('<div class="v','<div onclick="pickVerse('+n+')" class="v')}).join('')}</div>`
  :`<div class="note" style="margin-top:24px">Only John 1 is loaded in this prototype. Scripture text will load from the ESV provider once licensed.</div>`;
 return sun()+header(refName(),0,1)+listenerSide('read')+`<main><div class="col" style="margin:0 auto"><div class="row between rdhead"><div><h1>${refName()}</h1><div class="sub" style="font-family:var(--serif);font-size:17px;font-style:italic">${isJ1()?'The Word Became Flesh':''}</div></div><div class="row"><button class="btn ghost sm">‹ Prev</button><button class="btn ghost sm">Next ›</button></div></div>
 ${body}
 <button class="btn wide" style="margin-top:20px" onclick="go('choice')">Memorize</button>
 <div class="note rdnote">ESV badge shows the intended translation; prototype text is a public-domain placeholder.</div></div></main>
 <aside class="right"><h2>Memorize</h2><p class="sub" style="margin:6px 0 16px">Selected: ${refName()}:${S.range.a}–${S.range.b}</p><button class="btn solid" style="width:100%" onclick="go('choice')">Memorize</button>
 <div class="card" style="margin-top:22px"><div class="row between"><b style="color:var(--gold2);font-weight:500">Music</b>${MUSIC[S.book]&&MUSIC[S.book].includes(S.chap)?'<span class="dot"></span>':''}</div><p class="sub" style="margin-top:6px">${MUSIC[S.book]&&MUSIC[S.book].includes(S.chap)?S.genre+' recording available':'No recording for this chapter yet'}</p></div>
 <button class="btn ghost" style="width:100%;margin-top:14px" onclick="go('range')">Edit verse range</button></aside>`+playerBar()+navPanel();};

V.choice=()=>{setApp('noright noplayer');return sun()+header(refName()+':'+S.range.a+'–'+S.range.b)+listenerSide('choice')+`<main class="center"><div class="col" style="padding-top:60px;max-width:520px"><h1 style="text-align:center;font-size:30px;color:var(--text)">Choose a Memorization Method</h1><p class="sub" style="text-align:center;margin:8px 0 34px">${refName()}:${S.range.a}–${S.range.b}</p>
 <button class="opt" onclick="go('steps')">${ICON.list.replace('<svg','<svg class="big"')}<span><h2>Memorization Steps</h2><div class="sub">Listen, Sing, Recall, Chain</div></span><span class="go">›</span></button>
 <button class="opt" onclick="go('range')">${ICON.cards.replace('<svg','<svg class="big"')}<span><h2>Flashcards</h2><div class="sub">Practice in random order</div></span><span class="go">›</span></button></div></main>`+navPanel();};

const STEPS=[['Listen','Read along as the music plays.'],['Sing','Sing from the text without relying on the recording.'],['Recall','The text is hidden — recite it, then reveal to check.'],['Chain','Several verses hidden — recite or sing them all in order.']];
V.steps=()=>{setApp('');const st=S.step,{a,b}=S.range;if(S.cur<a||S.cur>b)S.cur=a;
 const all=Array.from({length:b-a+1},(_,i)=>a+i);let body;
 const multi=multiOn(st);
 const content=(n,hide)=>hide&&!(S.revealed&&n===S.cur)?dashed(vt(n)):vt(n);
 if(st===3)body=all.map(n=>verseRow(n,S.revealed?vt(n):dashed(vt(n)))).join('');
 else body=all.map((n,i)=>verseRow(n,content(n,st===2),'pick '+(n===S.cur?'':(multi?'fade':'gone')),`setCur(${n})`,S.stagger&&multi?`animation:cascade .8s ${i*120}ms backwards`:'')).join('');
 S.stagger=false;
 return sun()+header(refName()+':'+a+'–'+b)+listenerSide('choice')+`<main><div class="fillcol" style="max-width:760px">
  <div class="row between"><button id="multibtn" class="mini ${multi||st===3?'on':''}" title="${multiTitle(st)}" onclick="toggleMulti()">${ICON.list}</button><span class="row" style="gap:16px"><span class="sub" id="focuslbl">${focusLabel(st)}</span><button class="btn sm" onclick="go('cards')">${ICON.cards}Switch to Flashcards</button></span></div>
  <div class="scripture" style="flex:1;margin-top:26px">${body}</div>
  ${st>=2?`<div style="text-align:center;margin:14px 0"><button class="btn" style="padding:12px 34px;font-family:var(--display);font-size:19px;border-radius:99px" onclick="S.revealed=!S.revealed;render()">${ICON.eye}${S.revealed?'Hide Scripture':'Reveal Scripture'}</button></div>`:''}
  <div class="row" style="justify-content:flex-end;margin-top:8px"><button class="mini q" title="Help" onclick="S.help=!S.help;render()">${ICON.help}</button></div>
  ${S.help?`<div class="help"><b style="color:var(--gold2)">${STEPS[st][0]}.</b> ${STEPS[st][1]}</div>`:''}
  <div class="stepper" style="margin-top:12px"><button class="tri" onclick="stepTo(${(st+3)%4})">${ICON.triL}</button>
   <div class="sdots">${STEPS.map((s,i)=>`<button class="sd ${i===st?'on':''}" onclick="stepTo(${i})"><i></i>${s[0]}</button>`).join('')}</div>
   <button class="tri" onclick="stepTo(${(st+1)%4})">${ICON.triR}</button></div>
 </div></main>
 <aside class="right"><h2>${STEPS[st][0]}</h2><p class="sub" style="margin:6px 0 18px">${STEPS[st][1]}</p>
  <div class="card"><div class="sub" style="font-size:11px;letter-spacing:.14em">PASSAGE</div><div style="font-family:var(--display);font-size:22px;color:var(--gold2);margin-top:4px">${refName()}:${a}–${b}</div><button class="btn ghost sm" style="margin-top:12px" onclick="go('range')">Edit range</button></div>
  <div class="card" style="margin-top:14px"><div class="sub" style="font-size:11px;letter-spacing:.14em">WHEN THE VERSE ENDS</div><div class="row" style="margin-top:10px;color:var(--gold)">${ICON[S.modes.practice].replace('<svg','<svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.4"')}<span style="color:var(--text)">${MODES.find(x=>x[0]===S.modes.practice)[1]}</span></div></div>
  <div class="card" style="margin-top:14px"><div class="sub" style="font-size:11px;letter-spacing:.14em">GENRE</div><div class="row" style="margin-top:10px;color:var(--gold)">${ICON.note.replace('<svg','<svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.4"')}<span style="color:var(--text)">${S.genre}</span></div></div>
 </aside>`+playerBar()+navPanel();};
function stepTo(i){S.stagger=true;S.step=i;S.revealed=false;S.help=false;render()}

function fcOrder(){const a=[];for(let n=S.range.a;n<=S.range.b;n++)a.push(n);return S.fc.order||a}
V.cards=()=>{setApp('noright');const anim=S.cardAnim;S.cardAnim=false;const o=fcOrder();const n=o[S.fc.i%o.length];
 return sun()+header(refName()+':'+S.range.a+'–'+S.range.b)+listenerSide('cards')+`<main class="center"><div style="width:100%;max-width:800px;text-align:center">
 <div class="row between"><span class="sub" style="letter-spacing:.14em">CARD ${S.fc.i%o.length+1} OF ${o.length}</span><button class="btn sm" onclick="go('steps')">${ICON.list}Switch to Steps</button></div>
 <div class="fcrow"><button class="ico" onclick="fcMove(-1)">${ICON.prev}</button>
  <div class="fc-wrap"><div class="fc ${S.fc.flip?'flip':''} ${anim?'cardin':''}" onclick="this.classList.toggle('flip');S.fc.flip=!S.fc.flip">
   <div class="face"><span class="bk">${S.book.toUpperCase()}</span><div class="cv">${S.chap}:${n}</div><span class="hint">Tap to reveal</span></div>
   <div class="face back"><span class="bk" style="margin-bottom:16px">${S.book.toUpperCase()}</span><div class="vt"><b>${n}</b><span>${vt(n)}</span></div></div></div></div>
  <button class="ico" onclick="fcMove(1)">${ICON.fwd}</button></div>
 <button class="shuf" style="margin:20px auto 0" onclick="fcShuffle()">${ICON.shuffle}Shuffle</button>
 <p class="sub fc-hint" style="margin-top:14px;font-size:12px">Audio plays only when you press Play — never on flip, next or shuffle.</p></div></main>`+playerBar()+navPanel();};
function fcMove(d){const o=fcOrder();S.fc.i=(S.fc.i+d+o.length)%o.length;S.fc.flip=false;S.cardAnim=true;render()}
function fcShuffle(){S.fc.order=[...fcOrder()].sort(()=>Math.random()-.5);S.fc.i=0;S.fc.flip=false;S.cardAnim=true;render()}

V.range=()=>{setApp('noright noplayer');const{a,b}=S.range;
 return sun()+header('Flashcards')+listenerSide('cards')+`<main class="center"><div class="col" style="max-width:640px"><h1 style="font-size:30px">Select the range of verses</h1>
 <button class="dd" style="margin-top:18px" onclick="openNav(this,'left')">${refName()}<small>▾</small></button>
 <p class="sub" style="margin-top:16px;font-family:var(--serif);font-size:16px">${S.range.picking==='first'?'Now tap the closing verse.':'Tap a start verse, then an end verse. Tap Start or End below to change either one.'}</p>
 <div class="vgrid">${Array.from({length:TOTAL},(_,i)=>i+1).map(n=>`<button class="vb ${n===a||n===b?'end':(n>a&&n<b?'range':'')}" onclick="pickVerse(${n})">${n}</button>`).join('')}</div>
 <div class="row between rangefoot" style="margin-top:22px"><div class="row"><button class="chip" onclick="S.range.picking='start';render()">Start: ${a}</button><span class="sub">→</span><button class="chip" onclick="S.range.picking='end';render()">End: ${b}</button></div><span style="font-family:var(--serif)">Selected: ${refName()}:${a} – ${S.chap}:${b}</span></div>
 <div class="row" style="margin-top:22px"><button class="btn wide" style="flex:2" onclick="S.fc={i:0,flip:false,order:null};go('cards')">Start Flashcards</button><button class="btn wide ghost" style="flex:1;font-size:16px" onclick="go('steps')">Use for Steps</button></div>
 <div class="note">No fixed limit on range length. Cross-chapter selection is designed but still provisional in the project docs.</div></div></main>`+navPanel();};
function pickVerse(n){const r=S.range;
 if(r.picking==='start'){r.a=n;if(r.b<n)r.b=n;r.picking=null}
 else if(r.picking==='end'){r.b=n;if(r.a>n)r.a=n;r.picking=null}
 else if(r.picking==='first'){const s=r.a;r.a=Math.min(s,n);r.b=Math.max(s,n);r.picking=null}
 else{r.a=n;r.b=n;r.picking='first'}
 S.cur=r.a;S.fc={i:0,flip:false,order:null};render()}

/* ---------- ADMIN ---------- */
function adminSide(active){const nav=[['dash','Dashboard'],['upload','Upload music'],['library','Track library'],['timing','Timing editor'],['publish','Preview & publish']];
 return `<aside class="side"><div class="nav">${nav.map(([k,l])=>`<button class="${active===k?'on':''}" onclick="go('${k}')">${l}</button>`).join('')}</div><div class="nav" style="margin-top:26px"><button onclick="go('home')" style="color:var(--gold-dim)">← Listener app</button></div></aside>`;}
const TRACKS=[['John 1:1–18','Pop','Morning Light','Published'],['John 1:1–18','Rock','Anthem','Ready for Review'],['John 1:1–18','R&B','Slow Burn','Draft'],['Psalm 23','Pop','Still Waters','Published'],['Exodus 23:20–25','Rock','Angel Before You','Draft']];

 <table><tr><th>Track</th><th>Issue</th><th></th></tr><tr><td>John 1:1–18 · Rock</td><td class="flag warn">Gap and overlap need review · verse 18 unmapped</td><td><button class="btn sm" onclick="go('timing')">Open editor</button></td></tr><tr><td>John 1:1–18 · R&B</td><td class="flag">No verse timing yet</td><td><button class="btn sm" onclick="go('timing')">Open editor</button></td></tr></table></main>`;};
V.upload=()=>{setApp('admin');return sun()+header('Upload music',1)+adminSide('upload')+`<main><h1>Upload music</h1>
 ${wizard(0)}
 <div class="drop"><b>Drop an audio file</b>MP3 or WAV · chapter, passage or single verse<div style="margin-top:16px"><button class="btn">Choose file</button></div></div>

 <label>Translation<select><option>ESV</option><option>WEB</option></select></label><label>Genre<select id="genreSel" onchange="document.getElementById('customGenre').style.display=this.value==='Custom'?'flex':'none'"><option>Pop</option><option>Rock</option><option>R&B</option><option>Custom</option></select></label>
 <label>Book<select><option>John</option></select></label><div class="row"><label style="flex:1">Chapter<input value="1"></label><label style="flex:1">From verse<input value="1"></label><label style="flex:1">To verse<input value="18"></label></div>

 <div class="note">Saved as a new version — matching passage references never overwrite an existing recording.</div>
 <div class="row" style="margin-top:20px"><button class="btn solid" onclick="go('timing')">Save draft & set verse timing →</button></div></main>`;};
function titleCase(v){return v.replace(/(^|[\s\-\/])([a-z])/g,(m,a,b)=>a+b.toUpperCase())}
function wizard(cur){const L=['Upload','Metadata','Verse timing','Validation','Preview','Publish'];return `<div class="wizard">${L.map((l,i)=>`<div class="wz ${i===cur?'on':i<cur?'done':''}"><i>${i<cur?'✓':i+1}</i>${l}</div>`).join('')}</div>`}
V.library=()=>{setApp('admin');return sun()+header('Track library',1)+adminSide('library')+`<main><div class="row between"><h1>Track library</h1><button class="btn solid sm" onclick="go('upload')">Upload recording</button></div>
 <div class="tabs" style="margin-top:16px"><button class="on">All</button><button>Published</button><button>Ready for review</button><button>Drafts</button></div>
 <table><tr><th>Passage</th><th>Genre</th><th>Status</th><th>Uploaded</th><th></th></tr>${TRACKS.map(t=>`<tr><td>${t[0]}</td><td>${t[1]}</td><td>${pill(t[3])}</td><td class="sub">Oct 19</td><td><button class="btn sm" onclick="go('timing')">Timing</button></td></tr>`).join('')}</table></main>`;};

function peaks(){if(S._p)return S._p;let x=7;const r=()=>(x=(x*16807)%2147483647)/2147483647;S._p=Array.from({length:600},(_,i)=>{const e=.35+.5*Math.abs(Math.sin(i/23))+.15*r();return Math.min(1,e*(.6+.4*r()))});return S._p}
function problems(){const P=[];const T=S.timing;
 T.forEach((t,i)=>{const id=t.v;
  if(t.s==null||t.e==null){P.push({v:id,k:'err',m:'Missing boundary'});return}
  if(t.e<=t.s)P.push({v:id,k:'err',m:'End is before start'});
  if(t.s<0||t.e>S.dur)P.push({v:id,k:'err',m:'Outside audio duration'});
  const n=T[i+1];
  if(n&&n.s!=null&&t.e!=null){const d=n.s-t.e;
   if(d>0.5&&!S.ack['g'+id])P.push({v:id,k:'warn',m:`Gap of ${d.toFixed(2)}s before v${n.v}`,ack:'g'+id});
   if(d<-0.01&&!S.ack['o'+id])P.push({v:id,k:'warn',m:`Overlaps v${n.v} by ${(-d).toFixed(2)}s`,ack:'o'+id});}
 });return P}
V.timing=()=>{setApp('admin');const W=1000,H=170,px=t=>t/S.dur*W;const pk=peaks();
 const bars=pk.map((p,i)=>{const x=i/600*W;const h=p*H*.8;return `<rect x="${x}" y="${(H-h)/2}" width="1.4" height="${h}" fill="#7b6636"/>`}).join('');
 const regs=S.timing.filter(t=>t.s!=null&&t.e!=null).map(t=>{const sel=t.v===S.sel;return `<rect x="${px(t.s)}" y="0" width="${Math.max(1,px(t.e)-px(t.s))}" height="${H}" fill="${sel?'rgba(230,201,138,.28)':'rgba(201,164,92,.09)'}" stroke="${sel?'#e6c98a':'rgba(201,164,92,.35)'}" stroke-width=".6"/><text x="${px(t.s)+3}" y="13" fill="#e6c98a" font-size="10" font-family="Inter">${t.v}</text>`}).join('');
 const sel=S.timing[S.sel-1];
 const hand=sel&&sel.s!=null&&sel.e!=null?[['s',sel.s],['e',sel.e]].map(([k,t])=>`<g class="h" data-k="${k}" style="cursor:ew-resize"><line x1="${px(t)}" x2="${px(t)}" y1="0" y2="${H}" stroke="#fff" stroke-width="1.5"/><rect x="${px(t)-5}" y="${H/2-14}" width="10" height="28" rx="3" fill="#e6c98a"/></g>`).join(''):'';
 const ticks=Array.from({length:Math.floor(S.dur/20)+1},(_,i)=>i*20).map(t=>`<text x="${px(t)+2}" y="${H-4}" fill="#948c7a" font-size="10">${Math.floor(t/60)}:${String(t%60).padStart(2,'0')}</text>`).join('');
 const P=problems();
 return sun()+header('Timing editor',1)+adminSide('timing')+`<main><div class="row between"><div><h1>Timing editor</h1><div class="sub">John 1:1–18 · Rock · duration ${fmt(S.dur)}</div></div><div class="row"><span class="pill review">Draft v2 · autosaved</span><button class="btn ghost sm">Saved sessions ▾</button><button class="btn sm" onclick="go('publish')">Continue →</button></div></div>
 ${wizard(2)}
 <div class="row" style="margin-bottom:8px"><button class="ico play" style="width:40px;height:40px">${ICON.play}</button><button class="btn sm ghost">Play verse ${S.sel}</button><span class="sub">Zoom</span><input type="range" min="1" max="8" value="1" style="width:120px;padding:0"><span class="sub" style="margin-left:auto">Drag the gold handles or type exact times below</span></div>
 <svg id="wf" class="wf" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${bars}${regs}${hand}${ticks}</svg>
 <div class="row" style="gap:20px;align-items:flex-start;margin-top:16px">
  <div style="flex:1.5"><div class="tl" style="color:var(--gold-dim);font-size:11px;letter-spacing:.1em"><span>VERSE</span><span>START</span><span>END</span><span></span><span>STATUS</span></div>
  ${S.timing.map((t,i)=>{const pr=P.filter(p=>p.v===t.v);return `<div class="tl ${t.v===S.sel?'sel':''}" onclick="S.sel=${t.v};render()"><b style="color:var(--gold2);font-family:var(--display);font-size:17px">${t.v}</b><input value="${fmt(t.s)}" placeholder="m:ss.ss" onchange="setT(${i},'s',this.value)" onclick="event.stopPropagation()"><input value="${fmt(t.e)}" placeholder="m:ss.ss" onchange="setT(${i},'e',this.value)" onclick="event.stopPropagation()"><button class="btn sm ghost" onclick="event.stopPropagation()">▶</button><span class="flag ${pr.length?pr[0].k:'ok'}">${pr.length?pr.map(p=>p.m+(p.ack?` <a href="#" style="color:var(--gold)" onclick="event.preventDefault();event.stopPropagation();S.ack['${p.ack}']=1;render()">acknowledge</a>`:'')).join('<br>'):'✓'}</span></div>`}).join('')}</div>
  <div style="flex:.8" class="card"><h2>Validation</h2><p class="sub" style="margin:6px 0 12px">${P.filter(p=>p.k==='err').length} error(s) · ${P.filter(p=>p.k==='warn').length} to review</p>
  ${P.length?P.map(p=>`<div class="flag ${p.k}" style="margin-bottom:8px">v${p.v}: ${p.m}</div>`).join(''):'<div class="flag ok">All verses mapped.</div>'}
  <div class="note">Gaps and overlaps are never auto-fixed. Acknowledge the ones that are intentional.</div></div></div></main>`;};
function setT(i,k,v){S.timing[i][k]=parse(v);render()}
function wfDrag(){const svg=$('#wf');if(!svg)return;
 svg.querySelectorAll('.h').forEach(g=>g.addEventListener('pointerdown',ev=>{ev.preventDefault();const k=g.dataset.k;
  const mv=e=>{const r=svg.getBoundingClientRect();let t=(e.clientX-r.left)/r.width*S.dur;t=Math.max(0,Math.min(S.dur,Math.round(t*100)/100));S.timing[S.sel-1][k]=t;render()};
  const up=()=>{window.removeEventListener('pointermove',mv);window.removeEventListener('pointerup',up)};
  window.addEventListener('pointermove',mv);window.addEventListener('pointerup',up)}))}

V.publish=()=>{setApp('admin');const P=problems().filter(p=>p.k==='err');const ok=!P.length;
 return sun()+header('Preview & publish',1)+adminSide('publish')+`<main><h1>Preview & publish</h1><div class="sub">John 1:1–18 · Rock</div>${wizard(ok?4:3)}
 <div class="row" style="align-items:flex-start;gap:20px"><div class="card" style="flex:1.3"><h2>Listener preview</h2><p class="sub" style="margin:6px 0 14px">Uses the real playback engine and your verse timestamps.</p>
  <div class="row"><button class="btn sm">Verse 1</button><button class="btn sm ghost">Selected passage</button><button class="btn sm ghost">Entire recording</button></div>
  <div class="row" style="margin-top:18px;gap:8px"><button class="ico">${ICON.loop}</button><button class="ico">${ICON.stop}</button><button class="ico">${ICON.next}</button><span class="sub">Test each playback-end mode</span></div>
  <div class="apbar" style="margin-top:20px"><i></i></div></div>
 <div class="card" style="flex:1"><h2>Checklist</h2>
  <div class="flag ${ok?'ok':'err'}" style="margin:12px 0 6px">${ok?'✓ No blocking errors':'✕ '+P.length+' blocking error(s) — fix in the timing editor'}</div>
  <div class="flag ${problems().some(p=>p.k==='warn')?'warn':'ok'}">${problems().some(p=>p.k==='warn')?'! Gaps/overlaps still need review or acknowledgement':'✓ Gaps and overlaps reviewed'}</div>
  <div class="sub" style="margin:14px 0 6px">Status</div>${pill(S.status)}
  <div class="note">Editing a published track creates a new draft version. Listeners keep hearing the current version until you publish the new one.</div>
  <div class="row" style="margin-top:16px"><button class="btn ghost" onclick="S.status='Ready for Review';render()">Mark ready</button><button class="btn solid" ${ok?'':'disabled style="opacity:.4;cursor:not-allowed"'} onclick="if(${ok}){S.status='Published';render()}">Publish</button></div></div></div></main>`;};

// hover wipe: duplicate each bar's content into a dark-on-gold overlay that is revealed left→right on hover and retracts on leave
function enhanceBars(){document.querySelectorAll('#app .opt,#app .btn:not(.solid)').forEach(el=>{
 if(el.classList.contains('wipe'))return;el.classList.add('wipe');
 const o=document.createElement('span');o.className='fillx';o.setAttribute('aria-hidden','true');o.innerHTML=el.innerHTML;el.appendChild(o)})}
// scroll-linked reveal: items fade and rise as they travel up from the bottom edge of the scroll area
const REVEAL_ZONE=190;
function revealTick(){const m=$('#app main');if(!m)return;const calm=matchMedia('(prefers-reduced-motion: reduce)').matches;const mb=m.getBoundingClientRect().bottom;
 m.querySelectorAll('.rv').forEach(el=>{const t=calm?1:Math.max(0,Math.min(1,(mb-el.getBoundingClientRect().top-6)/REVEAL_ZONE));
  el.style.opacity=t.toFixed(3);el.style.transform=`translateY(${((1-t)*18).toFixed(1)}px)`})}
function applyDevice(){const adm=['dash','upload','library','timing','publish'].includes(S.screen);const ph=S.device==='mobile'&&!adm;
 $('#stage').classList.toggle('phone',ph);const app=$('#app');app.classList.toggle('mobile',ph||innerWidth<=520);app.classList.add('s-'+S.screen)}
function setDevice(d){S.device=d;render()}
function render(){reviewBar();const app=$('#app');const old=app.querySelector('.sun');
 app.innerHTML=V[S.screen]();applyDevice();const n=app.querySelector('.sun');if(old&&n)n.replaceWith(old);   // keep the ambient light animating across re-renders
 if(S.enter){app.classList.add('enter');S.enter=false}
 enhanceBars();
 const mn=$('#app main');if(mn){mn.onscroll=()=>{if(!S._raf)S._raf=requestAnimationFrame(()=>{S._raf=0;revealTick()})};revealTick()}
 if(S.screen==='timing')wfDrag();}
render();
</script>
</body>
</html>
