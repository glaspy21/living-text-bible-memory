# Local development database. Data lives in the named volume below.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: livingtext
    ports:
      - "5432:5432"
    volumes:
      - livingtext-db:/var/lib/postgresql/data

volumes:
  livingtext-db:
